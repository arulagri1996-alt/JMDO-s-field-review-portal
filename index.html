  .backdrop-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(180deg, rgba(10,15,5,0.32) 0%, rgba(10,15,5,0.06) 22%, rgba(255,255,255,0.02) 45%, rgba(255,255,255,0.20) 70%, rgba(255,255,255,0.38) 100%);
  }

  .app { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 40px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(120deg, #1F2A44 0%, #2E5A24 55%, #6E9B2C 100%);
    box-shadow: 0 4px 18px rgba(20,30,10,0.28);
  }
  .header-inner {
    max-width: 1000px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img.spic {
    width: 58px; height: 58px; border-radius: 999px; object-fit: contain;
    background: #FFFDF6; padding: 4px; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(255,251,235,0.65), 0 2px 8px rgba(0,0,0,0.25);
  }
  .brand .greenchip {
    background: #FFFDF6; border-radius: 14px; padding: 8px 12px; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(255,251,235,0.45), 0 2px 8px rgba(0,0,0,0.2);
  }
  .brand .greenchip img { height: 34px; width: auto; display: block; }
  .brand .title { color: #FFF7DC; min-width: 0; display: none; }
  .brand .title .t1 { font-weight: 700; font-size: 17px; line-height: 1.1; }
  .brand .title .t2 { font-size: 10px; letter-spacing: 0.06em; color: #E4F3C4; margin-top: 2px; }
  @media (min-width: 640px) { .brand .title { display: block; } .brand img.spic { width: 66px; height: 66px; } .brand .greenchip img { height: 40px; } }

  .switch-btn {
    background: rgba(255,255,255,0.16); color: #FFF7DC; border: none; border-radius: 999px;
    font-weight: 700; font-size: 12px; padding: 8px 14px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .switch-btn:hover { background: rgba(255,255,255,0.28); }

  /* ---------- layout helpers ---------- */
  .wrap { max-width: 680px; margin: 0 auto; padding: 22px 16px 10px; }
  .wrap-wide { max-width: 900px; margin: 0 auto; padding: 22px 16px 10px; }
  .card {
    background: rgba(255,255,255,0.94); backdrop-filter: blur(6px);
    border-radius: 20px; border: 1px solid rgba(228,214,160,0.7);
    box-shadow: 0 8px 26px rgba(40,60,10,0.10);
    padding: 20px; margin-bottom: 16px;
  }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #B9840E; margin-bottom: 4px; }
  h1.pagetitle { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: #22300E; margin: 0 0 4px; }
  p.subtitle { color: #6B7B45; font-size: 14px; margin: 0 0 18px; }

  label.field-label { display: block; font-size: 12px; font-weight: 700; color: #6B7B45; margin-bottom: 5px; }
  input, select {
    width: 100%; padding: 13px 14px; border-radius: 13px; border: 1.5px solid #DCE7B6;
    font-size: 15.5px; font-family: inherit; color: #23320F; background: #FEFEFB;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: #6E9B2C; box-shadow: 0 0 0 3px rgba(110,155,44,0.18); }
  .field { margin-bottom: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-primary {
    width: 100%; padding: 15px; border: none; border-radius: 14px; cursor: pointer;
    font-weight: 800; font-size: 15.5px; color: white;
    background: linear-gradient(120deg, #5D8A22, #85B93A);
    box-shadow: 0 6px 18px rgba(93,138,34,0.35);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .btn-primary:hover { box-shadow: 0 8px 22px rgba(93,138,34,0.45); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #D9D2B7; color: #A99B72; box-shadow: none; cursor: not-allowed; }

  .btn-ghost {
    background: none; border: none; color: #B9840E; font-weight: 700; font-size: 12px;
    cursor: pointer; padding: 4px 0; display: inline-flex; align-items: center; gap: 4px;
  }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
  .notice-bad {
    background: #FBEAE8; border: 1px solid #E3A79E; color: #8A2E24;
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.4;
  }

  .tab-groups {
    background: rgba(255,255,255,0.94); backdrop-filter: blur(6px);
    border-radius: 18px; padding: 14px 16px 16px; margin-bottom: 18px;
    box-shadow: 0 10px 28px rgba(34,48,14,0.12); border: 1px solid rgba(220,231,182,0.6);
  }
  .tab-group-label {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
    color: #96895D; margin: 12px 2px 7px;
  }
  .tab-group-label:first-child { margin-top: 2px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0; }
  .pill {
    border-radius: 999px; padding: 8px 15px; font-size: 12.5px; font-weight: 700;
    border: 1.5px solid #E4EBC8; background: #FBFAF2; color: #4B5D26; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .pill:hover { border-color: #B9CE85; box-shadow: 0 3px 10px rgba(93,138,34,0.14); transform: translateY(-1px); }
  .pill.active {
    background: linear-gradient(120deg, #3E5C17, #5D8A22); color: #F6F1DC; border-color: #3E5C17;
    box-shadow: 0 4px 14px rgba(62,92,23,0.35);
  }
  .pill.active:hover { transform: none; }

  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
  .badge.good { background: #DCEAB2; color: #3E5C17; }
  .badge.warn { background: #FBE7B2; color: #8A5E10; }
  .badge.bad  { background: #F6D3C4; color: #9C4426; }
  .badge.neutral { background: #EEE7CE; color: #6B5B2E; }

  .growth-track { width: 100%; height: 12px; border-radius: 999px; background: #E7E1C4; overflow: hidden; position: relative; }
  .growth-fill { height: 100%; border-radius: 999px; transition: width 0.7s ease; }
  .growth-fill.low { background: #C0562E; }
  .growth-fill.mid { background: #C08F1F; }
  .growth-fill.high { background: #5D8A22; }

  .role-card {
    display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.94);
    border: 1.5px solid #E4D6A0; border-radius: 20px; padding: 20px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(40,60,10,0.10); transition: transform 0.12s, box-shadow 0.15s;
    text-align: left; width: 100%; margin-bottom: 14px;
  }
  .role-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(40,60,10,0.16); }

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
/* ================= Firebase-backed storage (replaces the Claude-artifact-only window.storage) ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAnsk1XIddHCtp6RN0g35cDnU960im3XZc",
  authDomain: "spic-jmdo-portal.firebaseapp.com",
  databaseURL: "https://spic-jmdo-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "spic-jmdo-portal",
  storageBucket: "spic-jmdo-portal.firebasestorage.app",
  messagingSenderId: "788654689232",
  appId: "1:788654689232:web:92968f8ff257868a9fc7d5",
  measurementId: "G-S4NTNLGZ48"
};
firebase.initializeApp(firebaseConfig);
const _fbDB = firebase.database();

// Sign in anonymously so the database rules (which require auth != null) allow this app through,
// while blocking anyone hitting the database directly without running the app.
const _fbAuthReady = firebase.auth().signInAnonymously().catch(function (e) {
  console.error("Firebase anonymous sign-in failed:", e);
});

// Firebase Realtime Database keys can't contain '.', '#', '$', '[', ']', or '/'
function _fbSafeKey(key) {
  return String(key).replace(/[.#$\[\]\/]/g, "_");
}

// Matches the get/set(key, value, shared) shape the app already calls.
// shared=true  -> stored in Firebase, visible to every device/user (team data: entries, targets, roster, etc.)
// shared=false -> stored in this browser's localStorage only (per-device "last session" memory)
window.storage = {
  async get(key, shared) {
    if (!shared) {
      try {
        const raw = localStorage.getItem("local:" + key);
        return raw !== null ? { key, value: raw, shared: false } : null;
      } catch (e) { return null; }
    }
    await _fbAuthReady;
    const snap = await _fbDB.ref("shared/" + _fbSafeKey(key)).get();
    return snap.exists() ? { key, value: snap.val(), shared: true } : null;
  },
  async set(key, value, shared) {
    if (!shared) {
      try { localStorage.setItem("local:" + key, value); } catch (e) {}
      return { key, value, shared: false };
    }
    await _fbAuthReady;
    await _fbDB.ref("shared/" + _fbSafeKey(key)).set(value);
    return { key, value, shared: true };
  }
};

/* ================= Live Location Tracking ================= */
function startLiveTracking() {
  if (!navigator.geolocation) {
    STATE.liveTrackError = "This device/browser doesn't support location capture.";
    render();
    return;
  }
  STATE.liveTrackActive = true;
  STATE.liveTrackError = "";
  STATE.liveTrackLastSentAt = 0;
  render();
  STATE.liveTrackWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      const now = Date.now();
      if (STATE.liveTrackLastSentAt && now - STATE.liveTrackLastSentAt < 25000) return; // throttle ~25s
      STATE.liveTrackLastSentAt = now;
      try {
        await _fbAuthReady;
        const profile = STATE.profiles[STATE.name] || {};
        await _fbDB.ref("shared/live/" + _fbSafeKey(STATE.name)).set({
          name: STATE.name,
          region: profile.region || "",
          moHQ: profile.moHQ || "",
          jmdoHQ: profile.jmdoHQ || "",
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          updatedAt: now,
        });
      } catch (e) { /* ignore transient write errors, next tick retries */ }
      render();
    },
    (err) => {
      const messages = {
        1: "Location permission denied. Please allow location access for this site, then try again.",
        2: "Location unavailable right now — weak GPS/network signal.",
        3: "Location request timed out. Try again outdoors with a clear sky view.",
      };
      STATE.liveTrackError = messages[err.code] || "Could not get your location.";
      render();
    },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}
function stopLiveTracking() {
  if (STATE.liveTrackWatchId != null && navigator.geolocation) {
    navigator.geolocation.clearWatch(STATE.liveTrackWatchId);
  }
  STATE.liveTrackWatchId = null;
  STATE.liveTrackActive = false;
  STATE.liveTrackError = "";
  _fbAuthReady.then(() => _fbDB.ref("shared/live/" + _fbSafeKey(STATE.name)).remove()).catch(() => {});
  render();
}
function wireLiveTrackingHandlers() {
  const $ = (id) => document.getElementById(id);
  $("start-live-tracking")?.addEventListener("click", () => startLiveTracking());
  $("stop-live-tracking")?.addEventListener("click", () => stopLiveTracking());
}
function maybeAttachLiveListener() {
  if (STATE.liveListenerAttached) return;
  if (!(STATE.role === "rm" && STATE.rmTab === "live")) return;
  STATE.liveListenerAttached = true;
  _fbAuthReady.then(() => {
    _fbDB.ref("shared/live").on("value", (snap) => {
      STATE.liveLocations = snap.val() || {};
      render();
    });
  }).catch(() => {});
}
let _leafletMap = null, _leafletMarkers = {};
function updateLiveMapIfVisible() {
  const el = document.getElementById("live-map");
  if (!el || typeof L === "undefined") return;
  const now = Date.now();
  const rows = Object.entries(STATE.liveLocations || {}).filter(
    ([, r]) => now - (r.updatedAt || 0) < 120000
  );
  if (!_leafletMap) {
    _leafletMap = L.map(el).setView([10.9, 78.4], 7); // Tamil Nadu-ish default center
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap contributors",
    }).addTo(_leafletMap);
  } else {
    // el may have been recreated by innerHTML re-render; reattach the map to the fresh node
    if (_leafletMap.getContainer() !== el) {
      _leafletMap.remove();
      _leafletMap = L.map(el).setView([10.9, 78.4], 7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap contributors",
      }).addTo(_leafletMap);
      _leafletMarkers = {};
    }
  }
  const seen = new Set();
  rows.forEach(([key, r]) => {
    seen.add(key);
    if (_leafletMarkers[key]) {
      _leafletMarkers[key].setLatLng([r.lat, r.lng]);
    } else {
      _leafletMarkers[key] = L.marker([r.lat, r.lng]).addTo(_leafletMap);
    }
    _leafletMarkers[key].bindPopup(`<b>${r.name || ""}</b><br>${r.moHQ || ""} ${r.jmdoHQ || ""}`);
  });
  Object.keys(_leafletMarkers).forEach((key) => {
    if (!seen.has(key)) { _leafletMap.removeLayer(_leafletMarkers[key]); delete _leafletMarkers[key]; }
  });
  setTimeout(() => { try { _leafletMap.invalidateSize(); } catch (e) {} }, 50);
}
</script>

async function loadShared(key, fallback) {
  try { const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch { return fallback; }
}
async function saveShared(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), true); return true; } catch { return false; }
}
// Every save handler that edits one entry inside a shared dictionary (attendance, targets,
// SPCM, soil, MD programmes, farmers, profiles...) must not trust this browser's local copy of
// that dictionary — it may be hours old if the tab has been open a while. Fetching the current
// version from Firebase right before merging keeps the "stale window" down to a single
// round-trip (milliseconds) instead of an entire session, so one person's save can no longer
// silently erase another person's concurrent entries.
async function mergeFreshAndPersist(storageKey, stateField, updater) {
  const latest = await loadShared(storageKey, {});
  const next = updater(latest);
  STATE[stateField] = next;
  await saveShared(storageKey, next);
  return next;
}
async function loadDevice(fallback) {
  try { const r = await window.storage.get(DEVICE_KEY, false); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; }
}
async function saveDevice(value) {
  try { await window.storage.set(DEVICE_KEY, JSON.stringify(value), false); return true; } catch { return false; }
}

const ATTENDANCE_CUTOFF = { hour: 8, minute: 30 }; // Daily "Today's Visited Area" + attendance must be submitted before 8:30 AM
function isPastAttendanceDeadline(d) {
  const t = d || new Date();
  return (t.getHours() > ATTENDANCE_CUTOFF.hour) || (t.getHours() === ATTENDANCE_CUTOFF.hour && t.getMinutes() > ATTENDANCE_CUTOFF.minute);
}
function attendanceKey(name, date) { return `${name}||${date}`; }
// Working days = count of "Present" attendance entries logged for a JMDO within a given month (YYYY-MM).
function workingDaysInMonth(name, mk) {
  return Object.values(STATE.attendance).filter(a => a.name === name && monthKey(a.date) === mk && a.status === "Present").length;
}
let ALL_PACKINGS = [...new Set(PRODUCTS.map(p => p.packing).filter(Boolean))].sort();
function packingsForProduct(productName) {
  if (!productName) return ALL_PACKINGS;
  const list = [...new Set(PRODUCTS.filter(p => p.product === productName).map(p => p.packing).filter(Boolean))];
  return list.length ? list : ALL_PACKINGS;
}
// Rebuilds the live PRODUCTS list (used everywhere else in the file) from BASE_PRODUCTS plus
// anything added via the "Add New Product" panel in MO/MDO Review, and recomputes the derived
// SP_CATEGORIES / ALL_PACKINGS lists so every dropdown picks up new entries immediately.
function computeProducts() {
  PRODUCTS = [...BASE_PRODUCTS, ...STATE.productsAdded];
  SP_CATEGORIES = [...new Set(PRODUCTS.map(p => p.spCategory).filter(Boolean))];
  ALL_PACKINGS = [...new Set(PRODUCTS.map(p => p.packing).filter(Boolean))].sort();
}
// Same idea, for DEALERS — rebuilt from BASE_DEALERS plus anything added via "Add New Dealer".
function computeDealers() {
  DEALERS = [...BASE_DEALERS, ...STATE.dealersAdded];
}

function mdProgAchStatus(target, achieved) {
  const t = Number(target) || 0, a = Number(achieved) || 0;
  if (t <= 0 && a <= 0) return "Not Started (0%)";
  const pct = pctOf(a, t);
  if (pct >= 100) return "Achieved (100%+)";
  if (pct > 0) return "In Progress (1-99%)";
  return "Not Started (0%)";
}
// Duplicate / conflicting assignment guard: within the same month, a JMDO cannot be assigned the
// same Programme at two different Places (their monthly target for that programme is a single figure).
function findConflictingMdProgAssignment(name, programme, place, month, excludeKey) {
  return Object.entries(STATE.mdProg).find(([key, r]) => {
    if (key === excludeKey) return false;
    return r.name === name && r.programme === programme && r.targetMonth === month && r.place && place && r.place !== place;
  });
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
// Data is always stored internally as ISO (YYYY-MM-DD) so it sorts and filters correctly.
// Display/export uses DD/MM/YYYY, the standard convention for this team's reports.
function formatDateDMY(iso) {
  if (!iso || iso.length < 10) return iso || "";
  const [y, m, d] = iso.slice(0, 10).split("-");
  return `${d}/${m}/${y}`;
}
// Local submission clock-time, e.g. "8:47 AM" — used alongside the On Time / Late column in exports.
function formatSubmissionTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
}
function attendanceTimingLabel(rec) {
  if (!rec || !rec.firstSubmittedAt) return "";
  const submittedOnDate = rec.firstSubmittedAt.slice(0, 10);
  // If the entry was saved on a different calendar day than the attendance date itself, the
  // 8:30 AM cutoff for that date no longer applies in any meaningful sense — label it separately
  // rather than calling it "On Time".
  if (submittedOnDate !== rec.date) return "Backdated Entry";
  return rec.isLate ? "Late" : "On Time";
}
// Plain-text location cell for Excel exports: a Google Maps link when captured, "Missing" for a
// Present entry that has no GPS fix on file (e.g. saved before location capture was added), or
// blank for Leave entries where location isn't requested.
function attendanceLocationCell(rec) {
  if (rec?.location) return `https://www.google.com/maps?q=${rec.location.lat},${rec.location.lng}`;
  return rec?.status === "Present" ? "Missing" : "";
}
// Raw latitude/longitude as separate cells, so the sheet can be scanned/sorted/filtered directly
// in Excel without clicking through every map link.
function attendanceLatCell(rec) { return rec?.location ? rec.location.lat : ""; }
function attendanceLngCell(rec) { return rec?.location ? rec.location.lng : ""; }
function monthKey(d) { return d ? d.slice(0, 7) : ""; }
function currentMonth() { return monthKey(todayStr()); }
// ---- Annual cycle helpers (used to lock SPCM & Soil Sample targets to once-per-year) ----
function currentYearKey() { return String(new Date().getFullYear()); }
function nextYearKey() { return String(new Date().getFullYear() + 1); }
function yearCycleLabel(yk) { return yk ? `Apr ${yk}\u2013Mar ${Number(yk) + 1}` : ""; } // annual cycle label, adjust FY start if needed
function isTargetLockedForYear(rec) { return !!(rec && rec.target != null && rec.targetYear === currentYearKey()); }
function isSoilLockedForYear(rec) { return !!(rec && (rec.freeTarget != null || rec.paidTarget != null) && rec.targetYear === currentYearKey()); }
function monthLabel(mk) {
  if (!mk) return "";
  const [y, m] = mk.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
}
function fmtNum(n) { return (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- excel (csv) export ---------- */
function csvEscape(v) {
  const s = v == null ? "" : String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvEscape).join(",")].concat(rows.map(r => r.map(csvEscape).join(",")));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Rebuilds the live ROSTER (used everywhere else in the file) from BASE_ROSTER plus rosterAdded,
// minus anyone in rosterRemoved. Call this after loading roster changes from storage, and again
// after every add/remove, so every screen reading ROSTER picks up the change immediately.
function computeRoster() {
  const removedSet = new Set(STATE.rosterRemoved);
  ROSTER = [
    ...BASE_ROSTER.filter(r => !removedSet.has(r.name)),
    ...STATE.rosterAdded.filter(r => !removedSet.has(r.name)),
  ];
}
// Same idea as computeRoster(), but for the MO/MDO list.
function computeMomdo() {
  const removedSet = new Set(STATE.momdoRemoved);
  MOMDO = [
    ...BASE_MOMDO.filter(r => !removedSet.has(r.name)),
    ...STATE.momdoAdded.filter(r => !removedSet.has(r.name)),
  ];
}

/* ---------- roster-based cascading dropdown helpers (Region → MO H.Q → JMDO H.Q → JMDO Name) ---------- */
function allRegions() {
  return [...new Set(ROSTER.map(r => normalizeRegion(r.region)))].sort();
}
function moHqsForRegion(region) {
  if (!region) return [];
  const fromMomdo = MOMDO.filter(m => normalizeRegion(m.region) === region).map(m => m.hq);
  return [...new Set(fromMomdo)].sort();
}
function jmdoHqsForRegion(region) {
  if (!region) return [];
  return [...new Set(ROSTER.filter(r => normalizeRegion(r.region) === region).map(r => r.hq))].sort();
}
function jmdoNamesFor(region, jmdoHQ) {
  let rows = ROSTER;
  if (region) rows = rows.filter(r => normalizeRegion(r.region) === region);
  if (jmdoHQ) rows = rows.filter(r => r.hq === jmdoHQ);
  return [...new Set(rows.map(r => r.name))].sort();
}
function rosterLookup(name) { return ROSTER.find(r => r.name === name); }

function pctOf(ach, target) { return target > 0 ? (Number(ach) / Number(target)) * 100 : 0; }
function pctBadgeClass(pct) { return pct >= 100 ? "high" : pct >= 60 ? "mid" : "low"; }

/* ================= boot ================= */
async function boot() {
  const [e, p, t, sp, so, mp, at, ra, rr, ma, mr, pa, da, fa, d] = await Promise.all([
    loadShared(ENTRIES_KEY, []),
    loadShared(PROFILES_KEY, {}),
    loadShared(TARGETS_KEY, {}),
    loadShared(SPCM_KEY, {}),
    loadShared(SOIL_KEY, {}),
    loadShared(MDPROG_KEY, {}),
    loadShared(ATTENDANCE_KEY, {}),
    loadShared(ROSTER_ADDED_KEY, []),
    loadShared(ROSTER_REMOVED_KEY, []),
    loadShared(MOMDO_ADDED_KEY, []),
    loadShared(MOMDO_REMOVED_KEY, []),
    loadShared(PRODUCTS_ADDED_KEY, []),
    loadShared(DEALERS_ADDED_KEY, []),
    loadShared(FARMERS_KEY, {}),
    loadDevice(null),
  ]);
  STATE.entries = e; STATE.profiles = p; STATE.targets = t; STATE.spcm = sp; STATE.soil = so; STATE.mdProg = mp; STATE.attendance = at;
  STATE.rosterAdded = ra; STATE.rosterRemoved = rr; computeRoster();
  STATE.momdoAdded = ma; STATE.momdoRemoved = mr; computeMomdo();
  STATE.productsAdded = pa; computeProducts();
  STATE.dealersAdded = da; computeDealers();
  STATE.farmers = fa;
  if (d && d.role) { STATE.role = d.role; if (d.name) { STATE.name = d.name; STATE.jmdoStep = "form"; } }
  STATE.ready = true;
  render();
}

/* ================= render root ================= */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = headerHTML() + (
    !STATE.ready ? `<div class="wrap"><div class="empty-note"><div class="ic">🌱</div>Loading portal…</div></div>` :
    !STATE.role ? roleGateHTML() :
    STATE.role === "jmdo" ? jmdoViewHTML() :
    rmViewHTML()
  ) + `<footer class="foot">Data on this portal is shared — every JMDO and Regional Manager using this link sees the same live records.</footer>` + deleteFarmerConfirmModalHTML() + importFarmersConfirmModalHTML() + mdProgPhotoViewModalHTML();
  attachHandlers();
  wireLiveTrackingHandlers();
  maybeAttachLiveListener();
  updateLiveMapIfVisible();
}

/* ---------- Daily Attendance / Today's Visited Area — JMDO self-entry card ---------- */
function attendanceJmdoCardHTML(profile) {
  const today = todayStr();
  const d = STATE.attendanceSelfDraft || { date: today, place: "", status: "" };
  if (!d.date) d.date = today;
  const isToday = d.date === today;
  const key = attendanceKey(STATE.name, d.date);
  const rec = STATE.attendance[key] || null;
  // If nothing typed yet for the selected date, fall back to whatever is already saved for that date.
  const place = STATE.attendanceSelfDraft ? d.place : (rec?.place || "");
  const status = STATE.attendanceSelfDraft ? d.status : (rec?.status || "");
  const mk = currentMonth();
  const workingDays = workingDaysInMonth(STATE.name, mk);
  const now = new Date();
  const pastDeadline = isPastAttendanceDeadline(now);
  const willBeLate = isToday && !rec && pastDeadline;

  const history = Object.values(STATE.attendance)
    .filter(a => a.name === STATE.name)
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 10);

  // Location is only requested/required for marking TODAY's attendance as Present — a GPS fix
  // against an earlier date wouldn't reflect where the JMDO actually was that day.
  const locStatus = STATE.attendanceSelfDraft ? d.locationStatus : (rec?.location ? "success" : "idle");
  const locError = STATE.attendanceSelfDraft ? (d.locationError || "") : "";
  const loc = STATE.attendanceSelfDraft ? d.location : (rec?.location || null);
  const needsLocation = isToday && status === "Present";
  const locationBlockedSave = needsLocation && !loc;
  const locationBoxHTML = !needsLocation ? "" : `
      <div class="field">
        <label class="field-label">Your Location <span style="font-weight:400;color:#A99B72;">(required to save Present)</span></label>
        <div style="padding:10px 12px;border-radius:10px;border:1.5px solid ${locStatus === "success" ? "#B7D089" : locStatus === "error" ? "#EFC2AC" : "#E3D9B6"};background:${locStatus === "success" ? "#EDF5DC" : locStatus === "error" ? "#FBEAE0" : "#FBF7EA"};font-size:12px;margin-bottom:8px;">
          ${locStatus === "success" && loc ? `✓ Location captured (±${Math.round(loc.accuracy)}m) — <a href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank" rel="noopener" style="color:#3E5C17;font-weight:700;">view on map</a>` :
            locStatus === "capturing" ? "📍 Getting your location…" :
            locStatus === "error" ? `⚠ ${esc(locError)}` :
            "📍 Location not captured yet."}
        </div>
        <button type="button" id="att-capture-location" style="border:1.5px solid #6E9B2C;border-radius:999px;padding:8px 15px;background:white;color:#3E5C17;font-weight:800;font-size:12px;cursor:pointer;">📍 ${loc ? "Recapture" : "Capture"} my location</button>
      </div>`;

  return `
    <div class="card">
      <div style="font-weight:800;font-size:15px;color:#22300E;margin-bottom:6px;">🕗 Today's Visited Area &amp; Attendance</div>
      <p style="font-size:12px;color:#8A7A50;margin:0 0 12px;">Region: ${esc(profile.region || "—")} · MO H.Q: ${esc(profile.moHQ || "—")} · JMDO H.Q: ${esc(profile.jmdoHQ || "—")}</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <div style="flex:1;min-width:130px;padding:10px 12px;border:1.5px solid #E3D9B6;border-radius:12px;background:#FBF7EA;">
          <div style="font-size:11px;color:#8A7A50;font-weight:700;">Working Days — ${monthLabel(mk)}</div>
          <div style="font-size:18px;font-weight:800;color:#22300E;">${workingDays}</div>
        </div>
      </div>

      ${willBeLate ? `<div style="padding:10px 12px;border-radius:10px;background:#F6D3C4;color:#9C4426;font-size:12px;font-weight:700;margin-bottom:12px;">⏰ It's past the 8:30 AM deadline — today's entry will be recorded as Late.</div>` : ""}
      ${!isToday ? `<div style="padding:10px 12px;border-radius:10px;background:#EEE7CE;color:#6B5B2E;font-size:12px;font-weight:700;margin-bottom:12px;">📅 Editing a different date (${formatDateDMY(d.date)}) — not today's entry.</div>` : ""}
      ${rec && isToday ? `<div style="padding:10px 12px;border-radius:10px;background:${rec.isLate ? "#FBE7B2" : "#DCEAB2"};color:${rec.isLate ? "#8A5E10" : "#3E5C17"};font-size:12px;font-weight:700;margin-bottom:12px;">${rec.isLate ? "⏰ Submitted late for today" : "✓ Submitted on time for today"} — you can still update the details below.</div>` : ""}

      <div class="field"><label class="field-label">Date <span style="font-weight:400;color:#A99B72;">(required)</span></label><input type="date" id="att-date" value="${d.date}" max="${today}" /></div>
      <div class="field"><label class="field-label">Visited Area / Place</label><input id="att-place" value="${esc(place)}" placeholder="e.g. Gobichettipalayam market" /></div>
      <div class="field"><label class="field-label">Attendance Status</label>

  const names = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  for (let y = currentYear; y <= currentYear + 1; y++) {

  return out;
}

function timeAgoShort(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  return Math.round(m / 60) + "h ago";
}

/* ---------- Dashboard — combined overview across Sales/SPCM/Soil/MD Programmes ---------- */
function dashboardCombinedRows() {
  const mk = currentMonth();
  const monthTargets = STATE.targets[mk] || {};
  const allNames = [...new Set([
    ...STATE.entries.map(e => e.jmdoName),
    ...Object.keys(STATE.profiles),
    ...Object.keys(STATE.spcm),
    ...Object.keys(STATE.soil),
    ...Object.values(STATE.mdProg).map(r => r.name),
    ...Object.values(STATE.attendance).map(r => r.name),
  ])].filter(Boolean);

  let names = allNames;
  if (STATE.name) {
    const managed = allNames.filter(n => (STATE.profiles[n]?.rmName || "").trim().toLowerCase() === STATE.name.trim().toLowerCase());
    names = managed.length ? managed : allNames;
  }
  const q = (STATE.rmDashboardSearch || "").trim().toLowerCase();
  if (q) names = names.filter(n => [n, STATE.profiles[n]?.region, STATE.profiles[n]?.jmdoHQ, STATE.profiles[n]?.moHQ].some(v => (v || "").toLowerCase().includes(q)));

  return names.map(n => {
    const profile = STATE.profiles[n] || {};
    const monthEntries = STATE.entries.filter(e => e.jmdoName === n && monthKey(e.date) === mk);
    // Sales target is set in ₹ Lakhs of SP sales value, so achievement is validated against the
    // JMDO's total DIP/Invoice value for the month, not the qty.
    const salesQty = monthEntries.reduce((s, e) => s + (Number(e.qty) || 0), 0);
    const salesValueLakhs = monthEntries.reduce((s, e) => s + (Number(e.totalInvoiceValue) || 0), 0) / 100000;
    const salesTarget = Number(monthTargets[n]) || 0;
    const salesPct = pctOf(salesValueLakhs, salesTarget);

    const spcmRec = STATE.spcm[n] || {};
    const spcmTarget = Number(spcmRec.target) || 0, spcmAch = Number(spcmRec.ach) || 0;
    const spcmPct = pctOf(spcmAch, spcmTarget);

    const soilRec = STATE.soil[n] || {};
    const soilTarget = (Number(soilRec.freeTarget) || 0) + (Number(soilRec.paidTarget) || 0);
    const soilAch = (Number(soilRec.freeAch) || 0) + (Number(soilRec.paidAch) || 0);
    const soilPct = pctOf(soilAch, soilTarget);

    const mdRecs = Object.values(STATE.mdProg).filter(r => r.name === n && r.targetMonth === mk);
    const mdTarget = mdRecs.reduce((s, r) => s + (Number(r.target) || 0), 0);
    const mdAch = mdRecs.reduce((s, r) => s + (Number(r.achieved) || 0), 0);
    const mdPct = pctOf(mdAch, mdTarget);

    const activePcts = [
      salesTarget > 0 ? salesPct : null,
      spcmTarget > 0 ? spcmPct : null,
      soilTarget > 0 ? soilPct : null,
      mdTarget > 0 ? mdPct : null,
    ].filter(v => v != null);
    const overallPct = activePcts.length ? activePcts.reduce((s, v) => s + v, 0) / activePcts.length : 0;

    return {
      name: n, profile,
      salesQty, salesValueLakhs, salesTarget, salesPct,
      spcmTarget, spcmAch, spcmPct,
      soilTarget, soilAch, soilPct,
      mdTarget, mdAch, mdPct,
      overallPct, hasAnyTarget: activePcts.length > 0,
    };
  }).sort((a, b) => b.overallPct - a.overallPct);
}

/* ---------- Combined multi-sheet Excel export: Sales + SPCM + Soil + MD Programmes ---------- */
function downloadAllExcel() {
  if (typeof XLSX === "undefined") { alert("Excel export library failed to load — check your network connection and try again."); return; }
  const allNames = [...new Set([
    ...STATE.entries.map(e => e.jmdoName),
    ...Object.keys(STATE.profiles),
    ...Object.keys(STATE.spcm),
    ...Object.keys(STATE.soil),
    ...Object.values(STATE.mdProg).map(r => r.name),
    ...Object.values(STATE.attendance).map(r => r.name),
  ])].filter(Boolean);
  let names = allNames;
  if (STATE.name) {
    const managed = allNames.filter(n => (STATE.profiles[n]?.rmName || "").trim().toLowerCase() === STATE.name.trim().toLowerCase());
    names = managed.length ? managed : allNames;
  }
  const nameSet = new Set(names);
  const wb = XLSX.utils.book_new();

  // ---- Sheet 1: Sales Orders (all dates, every SP order entry) ----
  const salesHeader = ["JMDO Name","Date","Region","District","JMDO HQ","MDO / MO Name","MO (Validating Officer)","MO Validation Status","Dealer Type","Dealer / Sub Dealer Name","Place","Dealer District","Mobile No","Product","Packing","SP Category","Qty (MT/Litre)","Invoice Price / DIP","Total Value (Invoice / SP)","Sales Accounted","Accounted Via (Company/WS Dealer)"];
  const salesRows = [];
  names.forEach(n => {
    const profile = STATE.profiles[n] || {};
    STATE.entries.filter(e => e.jmdoName === n).sort((a,b)=> a.date < b.date ? 1 : -1).forEach(e => {
      salesRows.push([
        n, e.date, e.region || profile.region || "", e.district || profile.district || "", e.jmdoHQ || profile.jmdoHQ || "", e.rmName || profile.rmName || "", e.moName || "",
        e.moConfirmStatus === "Confirmed" ? "Confirmed" : e.moConfirmStatus === "Rejected" ? "Rejected" : "Pending",
        e.dealerType, e.dealerName, e.place || "", e.dealerDistrict || "", e.mobileNo || "",
        e.product || "", e.packing || "", e.spCategory || "", e.qty, e.invoicePrice, e.totalInvoiceValue, e.salesAccounted, e.accountedVia || "",
      ]);
    });
  });
  const wsSales = XLSX.utils.aoa_to_sheet([salesHeader, ...salesRows]);
  XLSX.utils.book_append_sheet(wb, wsSales, "Sales Orders");

  // ---- Sheet 2: SPCM ----
  const spcmHeader = ["Region","MO H.Q","JMDO H.Q","JMDO Name","Date","Target","Ach","Remaining to be Ach","Ach %"];
  const spcmRows = Object.entries(STATE.spcm).filter(([n]) => nameSet.has(n)).map(([n, r]) => {
    const target = Number(r.target) || 0, ach = Number(r.ach) || 0, remaining = Math.max(target - ach, 0), pct = pctOf(ach, target);
    return [r.region || "", r.moHQ || "", r.jmdoHQ || "", n, r.lastDate || "", target, ach, remaining, Number(pct.toFixed(1))];
  });
  const wsSpcm = XLSX.utils.aoa_to_sheet([spcmHeader, ...spcmRows]);
  XLSX.utils.book_append_sheet(wb, wsSpcm, "SPCM");

  // ---- Sheet 3: Soil Sample ----
  const soilHeader = ["Region","MO H.Q","JMDO H.Q","JMDO Name","Date","Free Soil Target","Free Soil Ach","Paid Sample Target","Paid Sample Ach","Remaining to be Ach","Ach %"];
  const soilRows = Object.entries(STATE.soil).filter(([n]) => nameSet.has(n)).map(([n, r]) => {
    const ft = Number(r.freeTarget) || 0, fa = Number(r.freeAch) || 0, pt = Number(r.paidTarget) || 0, pa = Number(r.paidAch) || 0;
    const totalTarget = ft + pt, totalAch = fa + pa, remaining = Math.max(totalTarget - totalAch, 0), pct = pctOf(totalAch, totalTarget);
    return [r.region || "", r.moHQ || "", r.jmdoHQ || "", n, r.lastDate || "", ft, fa, pt, pa, remaining, Number(pct.toFixed(1))];
  });
  const wsSoil = XLSX.utils.aoa_to_sheet([soilHeader, ...soilRows]);
  XLSX.utils.book_append_sheet(wb, wsSoil, "Soil Sample");

  // ---- Sheet 4: MD Programmes — Detailed ----
  const mdRows = Object.values(STATE.mdProg).filter(r => nameSet.has(r.name)).sort((a,b)=> (a.name||"").localeCompare(b.name||"") || (a.programme||"").localeCompare(b.programme||""));
  const mdHeader = ["Region","MO H.Q","JMDO H.Q","JMDO Name","Programme Name","Place / Location","Review Month","Assigned Date","Last Updated Date","Target","Achieved","Remaining","Farmers Participated","Achievement %","Achievement Status","Review Status","Remarks"];
  const mdDataRows = mdRows.map(r => {
    const target = Number(r.target) || 0, achieved = Number(r.achieved) || 0;
    const remaining = Math.max(target - achieved, 0);
    const pct = pctOf(achieved, target);
    return [
      r.region || "", r.moHQ || "", r.jmdoHQ || "", r.name || "", r.programme || "", r.place || "",
      monthLabel(r.targetMonth) || "", r.assignedDate || "", r.lastDate || "",
      target, achieved, remaining, r.farmers || 0, Number(pct.toFixed(1)),
      mdProgAchStatus(target, achieved), r.reviewStatus || MD_PROG_REVIEW_STATUSES[0], r.remarks || "",
    ];
  });
  const wsMd = XLSX.utils.aoa_to_sheet([mdHeader, ...mdDataRows]);
  XLSX.utils.book_append_sheet(wb, wsMd, "MD Programmes");

  // ---- Sheet 5: Daily Attendance — Region, MO H.Q, JMDO H.Q, JMDO NAME, Date, Visited Area/Place, Attendance Status, Submission Time, On Time / Late, Number of Working Days ----
  const attHeader = ["Region","MO H.Q","JMDO H.Q","JMDO NAME","Date","Visited Area/Place","Attendance Status","Latitude","Longitude","Location (Map Link)","Submission Time","On Time / Late","Number of Working Days"];
  const attRows = Object.values(STATE.attendance).filter(r => nameSet.has(r.name)).sort((a,b)=> (a.date < b.date ? 1 : -1) || a.name.localeCompare(b.name)).map(r => [
    r.region || "", r.moHQ || "", r.jmdoHQ || "", r.name, formatDateDMY(r.date), r.place || "", r.status || "", attendanceLatCell(r), attendanceLngCell(r), attendanceLocationCell(r),
    formatSubmissionTime(r.firstSubmittedAt), attendanceTimingLabel(r), workingDaysInMonth(r.name, monthKey(r.date)),
  ]);
  const wsAtt = XLSX.utils.aoa_to_sheet([attHeader, ...attRows]);
  XLSX.utils.book_append_sheet(wb, wsAtt, "Attendance");

  // ---- Sheet 5: Combined summary — one row per JMDO, all four modules side by side ----
  const combined = dashboardCombinedRows().filter(r => nameSet.has(r.name));
  const combinedHeader = ["JMDO Name","Region","MO H.Q","JMDO H.Q","Sales Target (₹L)","Sales Achieved (₹L)","Sales %","SPCM Target","SPCM Achieved","SPCM %","Soil Target","Soil Achieved","Soil %","MD Prog Target","MD Prog Achieved","MD Prog %","Overall %"];
  const combinedRows = combined.map(r => [
    r.name, r.profile.region || "", r.profile.moHQ || "", r.profile.jmdoHQ || "",
    r.salesTarget, Number(r.salesValueLakhs.toFixed(2)), Number(r.salesPct.toFixed(1)),
    r.spcmTarget, r.spcmAch, Number(r.spcmPct.toFixed(1)),
    r.soilTarget, r.soilAch, Number(r.soilPct.toFixed(1)),
    r.mdTarget, r.mdAch, Number(r.mdPct.toFixed(1)),
    Number(r.overallPct.toFixed(1)),
  ]);
  const wsCombined = XLSX.utils.aoa_to_sheet([combinedHeader, ...combinedRows]);
  XLSX.utils.book_append_sheet(wb, wsCombined, "Combined Summary");

  [wsSales, wsSpcm, wsSoil, wsMd, wsAtt, wsCombined].forEach(ws => { ws["!cols"] = new Array(20).fill({ wch: 16 }); });
  XLSX.writeFile(wb, `jmdo-all-modules-${todayStr()}.xlsx`);
}

function attendanceFilteredRows() {
  let rows = Object.values(STATE.attendance);
  if (STATE.name) {
    const managedNames = new Set(Object.keys(STATE.profiles).filter(n => (STATE.profiles[n]?.rmName || "").trim().toLowerCase() === STATE.name.trim().toLowerCase()));
    if (managedNames.size) rows = rows.filter(r => managedNames.has(r.name));
  }
  if (STATE.rmAttFilterFrom) rows = rows.filter(r => r.date >= STATE.rmAttFilterFrom);
  if (STATE.rmAttFilterTo) rows = rows.filter(r => r.date <= STATE.rmAttFilterTo);
  if (STATE.rmAttFilterRegion) rows = rows.filter(r => normalizeRegion(r.region) === normalizeRegion(STATE.rmAttFilterRegion));
  if (STATE.rmAttFilterName) rows = rows.filter(r => r.name === STATE.rmAttFilterName);
  return rows.sort((a, b) => (a.date < b.date ? 1 : -1) || a.name.localeCompare(b.name));
}

// Excel export with the exact required column sequence: Region, MO H.Q, JMDO H.Q, JMDO NAME,
// Visited Area/Place, Attendance Status, Number of Working Days.
function downloadAttendanceExcel() {
  const rows = attendanceFilteredRows();
  if (!rows.length) { alert("No attendance records match the current filters to export."); return; }
  if (typeof XLSX === "undefined") { alert("Excel export library failed to load — check your network connection and try again."); return; }
  const header = ["Region","MO H.Q","JMDO H.Q","JMDO NAME","Date","Visited Area/Place","Attendance Status","Latitude","Longitude","Location (Map Link)","Submission Time","On Time / Late","Number of Working Days"];
  const dataRows = rows.map(r => [
    r.region || "", r.moHQ || "", r.jmdoHQ || "", r.name, formatDateDMY(r.date), r.place || "", r.status || "", attendanceLatCell(r), attendanceLngCell(r), attendanceLocationCell(r),
    formatSubmissionTime(r.firstSubmittedAt), attendanceTimingLabel(r), workingDaysInMonth(r.name, monthKey(r.date)),
  ]);
  const ws = XLSX.utils.aoa_to_sheet([header, ...dataRows]);
  ws["!cols"] = new Array(header.length).fill({ wch: 18 });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Attendance");
  XLSX.writeFile(wb, `jmdo-attendance-${todayStr()}.xlsx`);
}

          const pct = pctOf(totalAch, totalTarget);
          return `<tr style="border-top:1px solid #F1EBD8;">
            <td style="padding:9px 10px;">${esc(r.region || "—")}</td>
            <td style="padding:9px 10px;">${esc(r.moHQ || "—")}</td>
            <td style="padding:9px 10px;">${esc(r.jmdoHQ || "—")}</td>
            <td style="padding:9px 10px;font-weight:700;">${esc(r.name)}</td>
            <td style="padding:9px 10px;">${esc(r.lastDate || "—")}</td>
            <td style="padding:9px 10px;">${fmtNum(ft)} / ${fmtNum(fa)}</td>
            <td style="padding:9px 10px;">${fmtNum(pt)} / ${fmtNum(pa)}</td>
            <td style="padding:9px 10px;">${fmtNum(remaining)}</td>
            <td style="padding:9px 10px;"><span class="badge ${pct >= 100 ? "good" : pct >= 60 ? "warn" : "bad"}">${pct.toFixed(0)}%</span></td>
            <td style="padding:9px 10px;"><span class="link-btn" data-edit-soil="${esc(r.name)}" style="cursor:pointer;">Edit</span></td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>
    </div>`}`;
}

/* ================= event wiring ================= */
function attachHandlers() {
  const $ = (id) => document.getElementById(id);

  $("btn-switch-role")?.addEventListener("click", async () => {
    if (STATE.liveTrackActive) stopLiveTracking();
    STATE.role = null; STATE.name = ""; STATE.jmdoStep = "name"; STATE.showProfileEdit = false; STATE.showTargets = false;
    await saveDevice(null);
    render();
  });

  $("pick-jmdo")?.addEventListener("click", async () => {
    STATE.role = "jmdo"; STATE.jmdoStep = "name";
    await saveDevice({ role: "jmdo" });
    render();
  });
  $("pick-rm")?.addEventListener("click", () => {
    STATE.pinGateOpen = true; STATE.pinInput = ""; STATE.pinError = "";
    render();
    setTimeout(() => $("pin-input")?.focus(), 30);
  });
  $("pin-cancel")?.addEventListener("click", () => {
    STATE.pinGateOpen = false; STATE.pinInput = ""; STATE.pinError = "";
    render();
  });
  $("pin-input")?.addEventListener("input", (e) => { STATE.pinInput = e.target.value; });
  $("pin-input")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("pin-submit")?.click(); });
  $("pin-submit")?.addEventListener("click", async () => {
    if (STATE.pinInput.trim() === "4733") {
      STATE.pinGateOpen = false; STATE.pinInput = ""; STATE.pinError = "";
      STATE.role = "rm";
      await saveDevice({ role: "rm" });
      render();
    } else {
      STATE.pinError = "Incorrect PIN. Please try again.";
      STATE.pinInput = "";
      render();
      setTimeout(() => $("pin-input")?.focus(), 30);
    }
  });

  // JMDO name step (click-to-select from roster)
  $("jmdo-name-input")?.addEventListener("input", (e) => { STATE.jmdoNameQuery = e.target.value; renderKeepFocus("jmdo-name-input"); });
  document.querySelectorAll("[data-pick-name]").forEach(btn => {
    btn.addEventListener("click", () => { STATE.name = btn.getAttribute("data-pick-name"); STATE.jmdoNameQuery = ""; goToJmdoForm(); });
  });

  // JMDO form step
  $("jmdo-change-name")?.addEventListener("click", () => { STATE.jmdoStep = "name"; STATE.showProfileEdit = false; STATE.jmdoNameQuery = ""; render(); });
  $("toggle-profile")?.addEventListener("click", () => { STATE.showProfileEdit = !STATE.showProfileEdit; render(); });

  // Dealer dropdown (mapped from the company dealer sheet)
  $("dealer-dropdown-toggle")?.addEventListener("click", () => { const open = !STATE.dealerDropdownOpen; closeOtherDropdowns("dealer"); STATE.dealerDropdownOpen = open; STATE.dealerQuery = ""; render(); });
  $("dealer-search-input")?.addEventListener("input", (e) => { STATE.dealerQuery = e.target.value; renderKeepFocus("dealer-search-input"); });
  document.querySelectorAll("[data-pick-dealer]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!STATE.jmdoForm) STATE.jmdoForm = freshJmdoForm();
      STATE.jmdoForm.dealerName = btn.getAttribute("data-pick-dealer");
      STATE.dealerDropdownOpen = false; STATE.dealerQuery = "";
      render();
    });
  });
  $("dealer-manual-toggle")?.addEventListener("click", () => { STATE.dealerManual = true; STATE.dealerDropdownOpen = false; render(); });
  $("dealer-back-to-list")?.addEventListener("click", () => {
    STATE.dealerManual = false;
    if (STATE.jmdoForm) STATE.jmdoForm.dealerName = "";
    render();
  });

  // Product dropdown (mapped from the product / packing / SP category sheet)
  $("product-dropdown-toggle")?.addEventListener("click", () => { const open = !STATE.productDropdownOpen; closeOtherDropdowns("product"); STATE.productDropdownOpen = open; STATE.productQuery = ""; render(); });
  $("product-search-input")?.addEventListener("input", (e) => { STATE.productQuery = e.target.value; renderKeepFocus("product-search-input"); });
  document.querySelectorAll("[data-pick-product-idx]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!STATE.jmdoForm) STATE.jmdoForm = freshJmdoForm();
      const p = PRODUCTS[Number(btn.getAttribute("data-pick-product-idx"))];
      if (p) { STATE.jmdoForm.product = p.product; STATE.jmdoForm.packing = p.packing; STATE.jmdoForm.spCategory = p.spCategory; }
      STATE.productDropdownOpen = false; STATE.productQuery = "";
      render();
    });
  });
  $("product-manual-toggle")?.addEventListener("click", () => { STATE.productManual = true; STATE.productDropdownOpen = false; render(); });
  $("product-back-to-list")?.addEventListener("click", () => {
    STATE.productManual = false;
    if (STATE.jmdoForm) { STATE.jmdoForm.product = ""; STATE.jmdoForm.packing = ""; STATE.jmdoForm.spCategory = ""; }
    render();
  });

  // MDO / MO name dropdown (validated against the MO/MDO/JMDO roster sheet)

      render(); e.target.value = ""; return;
    }
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const HEADER_MAP = {
          "region": "region", "mohq": "moHQ", "jmdohq": "jmdoHQ", "jmdoname": "jmdoName",
          "month": "month", "programmename": "programme", "farmername": "farmerName",
          "contactnumber": "contact", "contactaddress": "address", "location": "location",
          "acres": "acres", "crop1": "crop1", "crop2": "crop2", "crop3": "crop3",
        };
        const normKey = (k) => String(k || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        let imported = 0, skipped = 0;
        const additions = {};
        (results.data || []).forEach((row, idx) => {
          const mapped = {};
          Object.keys(row).forEach((k) => {
            const nk = normKey(k);
            if (HEADER_MAP[nk]) mapped[HEADER_MAP[nk]] = String(row[k] || "").trim();
          });
          if (!mapped.farmerName) { skipped++; return; }
          const id = "f_import_" + Date.now() + "_" + idx + "_" + Math.random().toString(36).slice(2, 6);
          additions[id] = {
            id, jmdoName: mapped.jmdoName || "", region: mapped.region || "", moHQ: mapped.moHQ || "", jmdoHQ: mapped.jmdoHQ || "",
            month: mapped.month || "", programme: mapped.programme || "", farmerName: mapped.farmerName,
            contact: mapped.contact || "", address: mapped.address || "", location: mapped.location || "",
            acres: mapped.acres || "", crop1: mapped.crop1 || "", crop2: mapped.crop2 || "", crop3: mapped.crop3 || "",
            createdAt: Date.now(),
          };
          imported++;
        });
        e.target.value = "";
        if (imported === 0) {
          STATE.farmerImportMsg = "⚠️ No valid rows found. Make sure the CSV has a 'Farmer Name' column with values.";
          render();
          return;
        }
        STATE.farmerImportMsg = "";
        STATE.pendingFarmerImport = { imported, skipped, additions };
        render();
      },
      error: (err) => {
        STATE.farmerImportMsg = "⚠️ Could not read that CSV file: " + err.message;

  function currentAttendanceDraft() {
    const today = todayStr();

    const rec = STATE.attendance[attendanceKey(STATE.name, today)] || {};

    // whatever was typed for the previously-selected date.
    STATE.attendanceSelfDraft = { date: newDate, place: rec.place || "", status: rec.status || "", location: rec.location || null, locationStatus: rec.location ? "success" : "idle", locationError: "" };
    render();
  });
  ["att-place","att-status"].forEach(id => {
    $(id)?.addEventListener("input", (e) => {
      if (!STATE.attendanceSelfDraft) STATE.attendanceSelfDraft = currentAttendanceDraft();
      const map = { "att-place": "place", "att-status": "status" };
      STATE.attendanceSelfDraft[map[id]] = e.target.value;
    });
    $(id)?.addEventListener("change", () => {
      $(id)?.dispatchEvent(new Event("input"));
      // Auto-prompt for a GPS fix the moment "Present" is chosen for today, so the JMDO isn't
      // surprised by a blocked Save button — they can still retry manually if this fails.
      if (id === "att-status" && $(id)?.value === "Present" && (STATE.attendanceSelfDraft?.date || todayStr()) === todayStr()) {
        captureAttendanceLocation();
      } else {
        render();
      }
    });
  });
  function captureAttendanceLocation() {
    if (!STATE.attendanceSelfDraft) STATE.attendanceSelfDraft = currentAttendanceDraft();
    if (!navigator.geolocation) {
      STATE.attendanceSelfDraft.locationStatus = "error";
      STATE.attendanceSelfDraft.locationError = "This device/browser doesn't support location capture.";
      render();
      return;
    }
    STATE.attendanceSelfDraft.locationStatus = "capturing";
    STATE.attendanceSelfDraft.locationError = "";
    render();
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (!STATE.attendanceSelfDraft) return;
        STATE.attendanceSelfDraft.location = {
          lat: pos.coords.latitude, lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy, capturedAt: new Date().toISOString(),
        };
        STATE.attendanceSelfDraft.locationStatus = "success";
        STATE.attendanceSelfDraft.locationError = "";
        render();
      },
      (err) => {
        if (!STATE.attendanceSelfDraft) return;
        const messages = {
          1: "Location permission denied. Please allow location access for this site in your browser/phone settings, then try again.",
          2: "Location unavailable right now — weak GPS/network signal. Move to an open area and try again.",
          3: "Location request timed out. Try again, ideally outdoors with a clear sky view.",
        };
        STATE.attendanceSelfDraft.locationStatus = "error";
        STATE.attendanceSelfDraft.locationError = messages[err.code] || "Could not get your location. Please try again.";
        render();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }
  $("att-capture-location")?.addEventListener("click", () => captureAttendanceLocation());
  $("save-attendance")?.addEventListener("click", async () => {
    const draft = currentAttendanceDraft();
    const date = ($("att-date")?.value || draft.date || todayStr()).trim();
    const today = todayStr();
    if (!date) { alert("Please select the Date for this attendance entry."); return; }
    if (date > today) { alert("The attendance date can't be in the future."); return; }
    const key = attendanceKey(STATE.name, date);
    const existing = STATE.attendance[key];
    const place = ($("att-place")?.value ?? draft.place ?? "").trim();
    const status = $("att-status")?.value ?? draft.status ?? "";
    if (!place) { alert("Please enter the Visited Area / Place."); return; }
    if (!status) { alert("Please select the Attendance Status (Present or Leave)."); return; }
    // GPS location is required for marking today's own attendance as Present — this is what
    // actually confirms the JMDO is in the field, not just typing a place name.
    const isTodayEntry = date === today;
    const draftLocation = (STATE.attendanceSelfDraft || draft)?.location || existing?.location || null;
    if (status === "Present" && isTodayEntry && !draftLocation) {
      alert("Please capture your location before saving today's Present attendance. Tap \"Capture my location\" and allow location access.");
      return;
    }
    const location = status === "Present" && isTodayEntry ? draftLocation : (existing?.location || null);
    const profile = STATE.profiles[STATE.name] || {};
    const rosterRow = ROSTER.find(r => r.name === STATE.name);
    const now = new Date();
    // Late is only meaningful for today's own entry, evaluated against the 8:30 AM cutoff.
    // Once a record already exists, keep its original on-time/late flag rather than re-evaluating
    // against the current time on every edit. Entries for a different (earlier) date are never "late".
    const isLate = date === today ? (existing ? !!existing.isLate : isPastAttendanceDeadline(now)) : false;
    const record = {
      name: STATE.name, date,
      region: profile.region || rosterRow?.region || "", moHQ: profile.moHQ || "", jmdoHQ: profile.jmdoHQ || rosterRow?.hq || "",
      place, status, isLate, location,
      firstSubmittedAt: existing?.firstSubmittedAt || now.toISOString(),
      updatedAt: now.toISOString(),
    };
    await mergeFreshAndPersist(ATTENDANCE_KEY, "attendance", (latest) => ({ ...latest, [key]: record }));
    STATE.attendanceSelfDraft = null;
    render();
  });

  document.querySelectorAll("[data-edit-mdprog]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-edit-mdprog");
      const rec = STATE.mdProg[key] || {};
      STATE.rmMdProgForm = { region: rec.region || "", moHQ: rec.moHQ || "", jmdoHQ: rec.jmdoHQ || "", name: rec.name || "", programme: rec.programme || MD_PROGRAMME_NAMES[0], place: rec.place || "", target: rec.target ?? "", achieved: rec.achieved ?? "", farmers: rec.farmers ?? "", lastDate: rec.lastDate || todayStr(), remarks: rec.remarks || "", reviewStatus: rec.reviewStatus || MD_PROG_REVIEW_STATUSES[0] };
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    });
  });
  $("btn-download-mdprog")?.addEventListener("click", () => downloadMdProgExcel());
}

/* ---------- MD Programmes — Monthly Review multi-sheet Excel export ---------- */
function downloadMdProgExcel() {
  const q = (STATE.rmMdProgSearch || "").trim().toLowerCase();
  let rows = Object.entries(STATE.mdProg).map(([key, r]) => ({ key, ...r }));
  if (q) rows = rows.filter(r => [r.name, r.programme, r.region, r.moHQ, r.jmdoHQ, r.place].some(v => (v || "").toLowerCase().includes(q)));
  if (STATE.mdProgFilterMonth) rows = rows.filter(r => r.targetMonth === STATE.mdProgFilterMonth);
  if (STATE.mdProgFilterName) rows = rows.filter(r => r.name === STATE.mdProgFilterName);
  if (STATE.mdProgFilterProgramme) rows = rows.filter(r => r.programme === STATE.mdProgFilterProgramme);
  if (STATE.mdProgFilterPlace) rows = rows.filter(r => r.place === STATE.mdProgFilterPlace);
  if (STATE.mdProgFilterStatus) rows = rows.filter(r => mdProgAchStatus(r.target, r.achieved) === STATE.mdProgFilterStatus);
  if (!rows.length) { alert("No MD Programme records match the current filters to export."); return; }
  if (typeof XLSX === "undefined") { alert("Excel export library failed to load — check your network connection and try again."); return; }
  rows.sort((a, b) => (a.name || "").localeCompare(b.name || "") || (a.programme || "").localeCompare(b.programme || ""));

  // ---- Detailed sheet: one row per JMDO + Programme + Place assignment ----
  const detailedHeader = ["Region","MO H.Q","JMDO H.Q","JMDO Name","Programme Name","Place / Location","Review Month","Assigned Date","Last Updated Date","Target","Achieved","Remaining","Farmers Participated","Achievement %","Achievement Status","Review Status","Remarks"];
  const detailedRows = rows.map(r => {
    const target = Number(r.target) || 0, achieved = Number(r.achieved) || 0;
    const remaining = Math.max(target - achieved, 0);
    const pct = pctOf(achieved, target);
    return [
      r.region || "", r.moHQ || "", r.jmdoHQ || "", r.name || "", r.programme || "", r.place || "",
      monthLabel(r.targetMonth) || "", r.assignedDate || "", r.lastDate || "",
      target, achieved, remaining, r.farmers || 0, Number(pct.toFixed(1)),
      mdProgAchStatus(target, achieved), r.reviewStatus || MD_PROG_REVIEW_STATUSES[0], r.remarks || "",
    ];
  });

  // ---- Summary sheet: aggregated by JMDO ----
  const byJmdo = {};
  rows.forEach(r => {
    const k = r.name || "Unknown";
    if (!byJmdo[k]) byJmdo[k] = { name: k, region: r.region || "", moHQ: r.moHQ || "", jmdoHQ: r.jmdoHQ || "", programmes: 0, places: new Set(), target: 0, achieved: 0 };
    byJmdo[k].programmes += 1;
    if (r.place) byJmdo[k].places.add(r.place);
    byJmdo[k].target += Number(r.target) || 0;
    byJmdo[k].achieved += Number(r.achieved) || 0;
  });
  const summaryHeader = ["JMDO Name","Region","MO H.Q","JMDO H.Q","Programmes Assigned","Distinct Places","Total Target","Total Achieved","Total Remaining","Achievement %"];
  const summaryRows = Object.values(byJmdo).sort((a, b) => a.name.localeCompare(b.name)).map(s => {
    const remaining = Math.max(s.target - s.achieved, 0);
    const pct = pctOf(s.achieved, s.target);
    return [s.name, s.region, s.moHQ, s.jmdoHQ, s.programmes, s.places.size, s.target, s.achieved, remaining, Number(pct.toFixed(1))];
  });

  // ---- Place breakdown sheet ----
  const byPlace = {};
  rows.forEach(r => {
    const k = r.place || "Unspecified";
    if (!byPlace[k]) byPlace[k] = { place: k, jmdos: new Set(), programmes: 0, target: 0, achieved: 0 };
    byPlace[k].jmdos.add(r.name || "");
    byPlace[k].programmes += 1;
    byPlace[k].target += Number(r.target) || 0;
    byPlace[k].achieved += Number(r.achieved) || 0;
  });
  const placeHeader = ["Place / Location","Distinct JMDOs","Programmes","Total Target","Total Achieved","Achievement %"];
  const placeRows = Object.values(byPlace).sort((a, b) => a.place.localeCompare(b.place)).map(p => {
    const pct = pctOf(p.achieved, p.target);
    return [p.place, p.jmdos.size, p.programmes, p.target, p.achieved, Number(pct.toFixed(1))];
  });

  const wb = XLSX.utils.book_new();
  const wsSummary = XLSX.utils.aoa_to_sheet([summaryHeader, ...summaryRows]);
  const wsDetailed = XLSX.utils.aoa_to_sheet([detailedHeader, ...detailedRows]);
  const wsPlace = XLSX.utils.aoa_to_sheet([placeHeader, ...placeRows]);
  [wsSummary, wsDetailed, wsPlace].forEach(ws => { ws["!cols"] = Object.keys(ws).filter(k => k[0] !== "!").length ? new Array(20).fill({ wch: 16 }) : []; });
  XLSX.utils.book_append_sheet(wb, wsSummary, "Summary by JMDO");
  XLSX.utils.book_append_sheet(wb, wsDetailed, "Detailed");
  XLSX.utils.book_append_sheet(wb, wsPlace, "Place Breakdown");
  XLSX.writeFile(wb, `md-programmes-monthly-review-${todayStr()}.xlsx`);
}

function goToJmdoForm() {
  STATE.jmdoStep = "form";
  STATE.jmdoForm = freshJmdoForm();
  closeOtherDropdowns(null);
  saveDevice({ role: "jmdo", name: STATE.name });
  render();
}

// Re-render while preserving focus + cursor position on a text input (used for live-typing fields)
function renderKeepFocus(id) {
  const el = document.getElementById(id);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById(id);
  if (el2) { el2.focus(); if (pos !== null) { try { el2.setSelectionRange(pos, pos); } catch {} } }
}

boot();

window.addEventListener("beforeunload", () => {
  if (STATE.liveTrackActive && STATE.name) {
    try { _fbDB.ref("shared/live/" + _fbSafeKey(STATE.name)).remove(); } catch (e) {}
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
